# Fail2Ban filter for Immich credential brute-force
# ============================================================================
# Matches failed password logins against Immich's local login endpoint:
#   POST /api/auth/login  -> 401 on wrong email/password
#
# This is intentionally narrow. It matches ONLY the credential-submission
# endpoint, so it never fires on the burst of 401s a legitimate client
# produces when its session token expires (those hit /api/users/me,
# /api/sync/ack, /api/assets/.../thumbnail, etc. — never /api/auth/login).
#
# Note: this deployment uses SSO-only (Google OIDC). The actual password
# check for SSO happens at the identity provider, not here, so this jail
# mainly guards against probing of the local login endpoint and against
# brute-force should password login ever be (re-)enabled.
# ============================================================================

[Definition]

# Log format: IP - - [timestamp] "METHOD /path HTTP/version" STATUS size "referer" "user-agent"
failregex = ^<HOST> -.* - \[[^\]]*\] "POST /api/auth/login HTTP\/1\.[01]" 401 \d+ ".*" ".*"$

ignoreregex =
